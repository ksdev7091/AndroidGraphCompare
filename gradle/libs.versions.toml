[versions]
agp = "9.4.1"
kotlin = "2.4.21"
compileSdk = "37"
targetSdk = "37"
minSdk = "24"

composeBom = "2026.09.00"
activityCompose = "1.13.0"
coreKtx = "1.19.1"
lifecycle = "2.11.0"

# 比較対象のグラフライブラリ
mpandroidchart3 = "v3.2.0"
mpandroidchart4 = "v4.0.1"
vico = "3.3.1"

benchmarkMacro = "1.5.0"
uiautomator = "2.4.0"
androidxJunit = "1.3.0"
profileinstaller = "1.4.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-profileinstaller = { group = "androidx.profileinstaller", name = "profileinstaller", version.ref = "profileinstaller" }

androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }

mpandroidchart3 = { group = "com.github.PhilJay", name = "MPAndroidChart", version.ref = "mpandroidchart3" }
mpandroidchart4-lib = { group = "com.github.PhilJay.MPAndroidChart", name = "MPChartLib", version.ref = "mpandroidchart4" }
mpandroidchart4-compose = { group = "com.github.PhilJay.MPAndroidChart", name = "MPChartCompose", version.ref = "mpandroidchart4" }
vico-compose = { group = "com.patrykandpatrick.vico", name = "compose", version.ref = "vico" }

androidx-benchmark-macro-junit4 = { group = "androidx.benchmark", name = "benchmark-macro-junit4", version.ref = "benchmarkMacro" }
androidx-test-uiautomator = { group = "androidx.test.uiautomator", name = "uiautomator", version.ref = "uiautomator" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxJunit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
android-test = { id = "com.android.test", version.ref = "agp" }
# AGP 9 の built-in Kotlin が使う KGP のバージョンを上げるためだけに宣言する（各モジュールでは適用しない）
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
